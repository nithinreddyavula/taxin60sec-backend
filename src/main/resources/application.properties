spring.datasource.url=${SPRING_DATASOURCE_URL} 
spring.datasource.username=${SPRING_DATASOURCE_USERNAME} 
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB



server.port=${PORT:8080}
app.public-url=${APP_PUBLIC_URL:https://www.tax60sec.com}

resend.api.key=${RESEND_API_KEY:test}

mail.from=noreply@tax60sec.com

admin.notification.email=${ADMIN_NOTIFICATION_EMAIL:compliance@taxin60sec.com}
admin.notification.whatsapp=${ADMIN_NOTIFICATION_WHATSAPP:}

whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:test}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:test}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:test}
whatsapp.graph-api-version=v22.0
whatsapp.api=https://graph.facebook.com
referral.discount.percent=${REFERRAL_DISCOUNT_PERCENT:20}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

call.provider.exotel.enabled=${EXOTEL_ENABLED:false}
call.provider.exotel.sid=${EXOTEL_SID:}
call.provider.exotel.api-key=${EXOTEL_API_KEY:}
call.provider.exotel.api-token=${EXOTEL_API_TOKEN:}
call.provider.exotel.exophone=${EXOTEL_EXOPHONE:}
call.provider.exotel.subdomain=${EXOTEL_SUBDOMAIN:api.exotel.com}

# RazorpayX Payouts - moves a CA's released escrow earnings to their bank account/UPI.
# Separate from payment.razorpay.* above, which only handles the client paying IN.
# Requires an actual RazorpayX current account; account-number is that account's number,
# NOT a bank account number. Until enabled, StubPayoutProvider tracks payouts as owed
# without attempting to send them - see PayoutProvider.
payout.provider.razorpayx.enabled=${RAZORPAYX_PAYOUTS_ENABLED:false}
payout.razorpayx.key-id=${RAZORPAYX_KEY_ID:}
payout.razorpayx.key-secret=${RAZORPAYX_KEY_SECRET:}
payout.razorpayx.account-number=${RAZORPAYX_ACCOUNT_NUMBER:}