spring.datasource.url=${SPRING_DATASOURCE_URL} 
spring.datasource.username=${SPRING_DATASOURCE_USERNAME} 
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB



server.port=${PORT:8080}
app.public-url=http://localhost:3000

resend.api.key=${RESEND_API_KEY}

mail.from=noreply@tax60sec.com

admin.notification.email=${ADMIN_NOTIFICATION_EMAIL:compliance@tax60sec.com}
admin.notification.whatsapp=${ADMIN_NOTIFICATION_WHATSAPP:}

whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:test}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:test}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:test}
whatsapp.graph-api-version=v22.0
whatsapp.api=https://graph.facebook.com